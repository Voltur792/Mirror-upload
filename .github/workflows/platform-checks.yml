name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      PIXEL_DRUMMER_DATA: ${{ github.workspace }}/.tmp-platform-tests/pixel
      PIXEL_DRUMMER_PACK: ${{ github.workspace }}/.tmp-platform-tests/pack
      COMPONENT_MIRROR_STATE: ${{ github.workspace }}/.tmp-platform-tests/mirror-state
      COMPONENT_MIRROR_ASTRA_DATA: ${{ github.workspace }}/.tmp-platform-tests/astra-data
      SEA_BATTLE_DATA_DIR: ${{ github.workspace }}/.tmp-platform-tests/sea
      ASTRA_DETECTIVE_DATA_DIR: ${{ github.workspace }}/.tmp-platform-tests/detective
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpulse0 libegl1 libopengl0
      - run: python -m pip install -r requirements.lock
      - name: Compile sources
        run: python -m compileall -q src
      - name: Offline tests (no real desktop, audio input or installers)
        run: python -m unittest discover -s tests -v
