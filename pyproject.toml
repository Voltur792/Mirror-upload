[project]
name = "component_mirror"
version = "0.5.4"
description = "Set up Windows runtimes, offline libraries and local Astra models from a verified Yandex Disk mirror."
requires-python = ">=3.11"
dependencies = [
    "astra-plugin-sdk>=0.6,<0.7",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"`, then `pytest`. The harness itself ships in the SDK,
# so this extra adds the runner and nothing else.
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
